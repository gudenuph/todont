name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A contributor's fork should be able to run this; it needs nothing but the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 is native and ships prebuilds; npm ci fetches one rather
      # than compiling, so no build toolchain is needed here.
      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  # Proves the published image actually builds, on every change rather than
  # only when a release is tagged and it is too late to find out.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
