# Follows the conventions already on the host: state under $STATE_DIR,
# published on the docker bridge address so Nginx Proxy Manager can reach it
# while the port stays off the public interface.
version: "3.7"

services:
  tracker:
    build: .
    image: todont-tracker:latest
    container_name: todont-tracker
    restart: unless-stopped
    env_file:
      - $STATE_DIR/tracker.env
    ports:
      # 172.17.0.1 is the docker0 gateway — reachable from the proxy container
      # and from the host, never from the internet.
      - "172.17.0.1:4310:4310"
    volumes:
      - $STATE_DIR/data:/data
