# bugs.ezmuze.studio — reverse proxy to the tracker on 127.0.0.1:4310.
#
# Install as /etc/nginx/sites-available/bugs.ezmuze.studio and symlink into
# sites-enabled. certbot rewrites this file to add the TLS block and the
# port 80 redirect; run it after the HTTP-only version is serving.

server {
    listen 80;
    listen [::]:80;
    server_name bugs.ezmuze.studio;

    # Uploads are capped at 10MB per file in the app; leave nginx a little room
    # above that so the app returns its own message instead of nginx's 413.
    client_max_body_size 12m;

    access_log /var/log/nginx/bugs.ezmuze.studio.access.log;
    error_log  /var/log/nginx/bugs.ezmuze.studio.error.log;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The sign-in handshake polls ezmuze central server-side; give it room.
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
